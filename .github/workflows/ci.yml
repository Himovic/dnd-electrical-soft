name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: ./scripts/build.sh
      - name: Verify exports with third-party parsers
        run: |
          pip install ezdxf pypdf openpyxl
          dotnet run --project src/DND.Electrical.Cli -c Release -- license evaluation
          dotnet run --project src/DND.Electrical.Cli -c Release -- demo all --out out/demo
          dotnet run --project src/DND.Electrical.Cli -c Release -- export out/demo/DEMO-IND-001.dndx --format handover --out out/handover
          python3 scripts/verify-exports.py out/handover
      - name: PowerStudio benchmark and demo studies
        run: |
          dotnet run --project src/DND.Electrical.Cli -c Release -- power sample:ieee14 --study lf --out out/ieee14.txt
          grep -q "Converged: yes" out/ieee14.txt
          dotnet run --project src/DND.Electrical.Cli -c Release -- power sample:demo --out out/demo-power.txt --tcc out/tcc.svg
          python3 -c "import xml.etree.ElementTree as E; E.parse('out/tcc.svg')"
      - name: Verify 3D exports (trimesh and Khronos glTF-Validator)
        run: |
          pip install trimesh
          dotnet run --project src/DND.Electrical.Cli -c Release -- model3d out/demo/DEMO-CAB-004.dndx --out out/cab.glb
          dotnet run --project src/DND.Electrical.Cli -c Release -- model3d out/demo/DEMO-CAB-004.dndx --out out/cab.stl
          python3 scripts/verify-3d.py out/cab.glb out/cab.stl --expect-extents-mm 800,300,1200
          mkdir -p out/validator && cd out/validator && npm init -y > /dev/null && npm install gltf-validator > /dev/null
          node ../../scripts/verify-gltf.mjs ../cab.glb

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build src/DND.Electrical.App -c Release
